name: Build Kernel with KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: mt6878/Galaga/v
          submodules: 'recursive'
          fetch-depth: 1

      - name: Setup KernelSU-Next
        run: |
          echo "=== Patching KernelSU-Next ==="
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -   # ← исправленный путь

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make libc6-dev libncurses5-dev crossbuild-essential-arm64 python3

      - name: Build Kernel
        run: |
          echo "=== Starting build ==="
          export ARCH=arm64
          export SUBARCH=arm64
          # если нужен clang из AOSP — скачай или используй тот, что в action'е обычно ставит
          make -j$(nproc) gki_defconfig
          make -j$(nproc)
