name: Build Kernel with KSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: mt6878/Galaga/v
          submodules: 'recursive'
          fetch-depth: 1

      - name: Build with KernelSU-Next
        uses: dabao1955/kernel_build_action@v1.10.0   # ← было @main, теперь v1
        with:
          kernel-url: .
          kernel-branch: mt6878/Galaga/v
          defconfig: gki_defconfig
          ksu: true
          ksu-other: true
          ksu-url: https://github.com/KernelSU-Next/KernelSU-Next
          clang: aosp
          anykernel3: true
